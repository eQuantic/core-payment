name: Release

# A merge is a release. Every push to main builds and tests, then semantic-release takes the version
# from the commit messages since the last tag (✨ feat is a minor, 🐛 fix and ⚡ perf a patch, a ! or a
# BREAKING CHANGE a major, and anything else releases nothing), writes CHANGELOG.md, tags, publishes
# every package with its symbols to nuget.org and creates the GitHub release. The release commit
# carries [skip ci], so it never starts this workflow again.
#
# nuget.org is reached through Trusted Publishing: the job's GitHub OIDC token is exchanged for a key
# that lives one hour, under a policy on nuget.org bound to this repository, this file and the
# `nuget` environment, for eQuantic.Payment* only. No long-lived key is stored anywhere.
#
# Run by hand with a tag, it publishes that tag again: one semantic-release cut whose packages never
# reached nuget.org, since semantic-release never publishes a tag that already exists.
on:
  push:
    branches: [main, preview]
  workflow_dispatch:
    inputs:
      tag:
        description: A release tag already cut (vX.Y.Z) to publish again; empty releases as a push does
        required: false
        default: ''

permissions:
  contents: read

# One release at a time per branch, and never one cancelled midway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write        # the release commit, the tag and the GitHub release
      issues: write          # an issue when a release fails
      pull-requests: write   # a comment on the pull requests a release carried
      id-token: write        # the OIDC token nuget.org's Trusted Publishing exchanges for a key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0          # semantic-release reads the whole history and its tags
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The gate CI applies: nothing is released that does not build and pass its tests.
      - name: Build and test
        run: |
          dotnet build -c Release
          dotnet test --no-build -c Release

      # Before anything is tagged: a login that fails stops the run with nothing cut. NUGET_USER is
      # the nuget.org profile name of the policy's creator, not an e-mail address.
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # conventional-changelog-conventionalcommits stays on v8: v9 and later target a newer
      # conventional-changelog stack than semantic-release bundles, and the release notes come out
      # empty while the version is still computed.
      - name: Semantic release
        if: ${{ !inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          GIT_AUTHOR_NAME: eQuantic Release Bot
          GIT_AUTHOR_EMAIL: noreply@equantic.tech
          GIT_COMMITTER_NAME: eQuantic Release Bot
          GIT_COMMITTER_EMAIL: noreply@equantic.tech
        run: >
          npx --yes
          -p semantic-release@25
          -p @semantic-release/changelog@6
          -p @semantic-release/exec@7
          -p @semantic-release/git@10
          -p conventional-changelog-conventionalcommits@8
          semantic-release

      # The tag's own scripts pack and push it, as they did when it was cut, so this step is written
      # here rather than in a script the tag may predate. The tag comes in through the environment,
      # never into the script's text, and is never echoed back.
      - name: Publish a tag already cut
        if: ${{ inputs.tag }}
        env:
          TAG: ${{ inputs.tag }}
          NUGET_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::the tag input is not a release tag (vX.Y.Z or vX.Y.Z-preview.N)"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$TAG^{commit}")" ]; then
            echo "::error::the checkout is not at the tag's commit"
            exit 1
          fi

          version="${TAG#v}"
          bash .github/scripts/release-prepare.sh "$version"
          bash .github/scripts/release-publish.sh

          # The GitHub release semantic-release would have made, from the tag's CHANGELOG section.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            awk -v heading="## [$version]" 'index($0, "## ") == 1 { if (on) exit; on = index($0, heading) == 1; next } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" artifacts/packages/*.nupkg artifacts/packages/*.snupkg \
              --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
