name: Publish

# A release tag publishes every package at the tag's version: pushing v1.2.0 publishes 1.2.0.
# The glob below also matches v1.2.3.4 or v1.2.3-rc.1; the first step fails any tag that is not vX.Y.Z.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Version from the tag
        shell: bash
        run: |
          release='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$GITHUB_REF_NAME" =~ $release ]]; then
            echo "::error::'$GITHUB_REF_NAME' is not a release tag: a release is vX.Y.Z, such as v1.2.0."
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build and test
        run: |
          dotnet build -c Release -p:Version="$VERSION"
          dotnet test --no-build -c Release

      - name: Pack
        run: dotnet pack --no-build -c Release -p:Version="$VERSION" -o artifacts

      # The symbol packages beside them (.snupkg) go along to NuGet's symbol server.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
