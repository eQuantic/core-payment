name: Publish

# A release tag publishes every package at the tag's version: pushing v1.2.0 publishes 1.2.0.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          dotnet build -c Release -p:Version="$VERSION"
          dotnet test --no-build -c Release

      - name: Pack
        run: dotnet pack --no-build -c Release -p:Version="$VERSION" -o artifacts

      # The symbol packages beside them (.snupkg) go along to NuGet's symbol server.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
